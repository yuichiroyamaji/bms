name: Deploy to AWS (OpenNext)

# Deploys the Next.js app to AWS via OpenNext (CloudFront + Lambda + S3).
#
# Setup required:
# 1. Deploy InfraStack (creates the GitHub OIDC role): npx cdk deploy InfraStack-dev -c environment=dev
# 2. Add GitHub secrets: AWS_ROLE_ARN (the role output by InfraStack) and AWS_REGION
# 3. develop -> dev is auto-deployed. Uncomment 'main' below to auto-deploy prod,
#    or trigger prod manually via "Run workflow".

on:
  push:
    branches:
      - develop  # Auto-deploy dev environment
      # Uncomment the line below to enable auto-deploy to production
      # - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - prod

jobs:
  deploy:
    name: Deploy (OpenNext)
    runs-on: ubuntu-latest

    # Use GitHub Environments for production approval
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
      url: ${{ steps.deployment.outputs.cloudfront_url }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            infra/package-lock.json

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (OpenNext bundle)
        working-directory: frontend
        run: npm run build:open-next

      - name: Install infrastructure dependencies
        working-directory: infra
        run: npm ci

      - name: Build infrastructure
        working-directory: infra
        run: npm run build

      - name: CDK Diff
        working-directory: infra
        run: npx cdk diff AppStack-${{ steps.env.outputs.environment }} -c environment=${{ steps.env.outputs.environment }}

      - name: Deploy to AWS
        working-directory: infra
        run: npx cdk deploy AppStack-${{ steps.env.outputs.environment }} -c environment=${{ steps.env.outputs.environment }} --require-approval never

      - name: Get deployment info
        id: deployment
        working-directory: infra
        run: |
          CLOUDFRONT_URL=$(aws cloudformation describe-stacks \
            --stack-name bms-app-${{ steps.env.outputs.environment }} \
            --query 'Stacks[0].Outputs[?contains(OutputKey, `CloudFrontUrl`)].OutputValue | [0]' \
            --output text)
          echo "cloudfront_url=$CLOUDFRONT_URL" >> $GITHUB_OUTPUT

      - name: Deployment summary
        run: |
          echo "## Deployment Successful! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ steps.env.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**CloudFront URL:** ${{ steps.deployment.outputs.cloudfront_url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed at:** $(date)" >> $GITHUB_STEP_SUMMARY
